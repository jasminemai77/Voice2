[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "voice2"
version = "0.1.0"
description = "Hardware-adaptive local realtime voice platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "psutil>=6.1,<8",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
  "lameenc>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
voxcpm = ["voxcpm==2.0.3; python_version < '3.13'"]

[project.scripts]
voice2 = "voice2.main:run"

[project.entry-points."voice2.providers"]
demo = "voice2.providers.demo:DemoTtsProvider"
voxcpm = "voice2.providers.voxcpm:VoxCpmProvider"
openvoice = "voice2.providers.openvoice:OpenVoiceProvider"
cosyvoice = "voice2.providers.cosyvoice:CosyVoiceProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/voice2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["python_tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
